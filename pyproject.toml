[build-system]
requires = ["setuptools>=77.0.3", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tile-identity-resolver"
version = "0.1.0"
description = "Resolve Tile identities from FEED service data without Bluetooth dependencies"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dependencies = []
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Operating System :: OS Independent",
    "Typing :: Typed",
]

[project.urls]
Homepage = "https://github.com/kbck/tile-identity-resolver"
Repository = "https://github.com/kbck/tile-identity-resolver"
Issues = "https://github.com/kbck/tile-identity-resolver/issues"

[project.optional-dependencies]
test = ["pytest>=8,<9"]
dev = [
    "pytest>=8,<9",
    "ruff>=0.11,<1",
    "build>=1,<2",
    "mypy>=1.15,<3",
    "twine>=6,<7",
    "check-wheel-contents>=0.6,<1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
tile_identity_resolver = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
